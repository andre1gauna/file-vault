name: ${PROJECT_NAME:-file-vault}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Carrega variáveis do Django a partir do arquivo definido na raiz/.env
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    # Valores extras/overrides — substituem chaves iguais do env_file
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Hot reload no dev: monta seu código local no container
      - ./backend:/app
      # Persistência
      - media_data:/app/media
      - static_data:/app/staticfiles
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Carrega variáveis do frontend a partir do arquivo definido na raiz/.env
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env.development}
    environment:
      # Mantém compatibilidade com CRA (REACT_APP_) e Vite (VITE_)
      REACT_APP_API_URL: ${API_URL:-http://localhost:8000/api}
      VITE_API_URL: ${API_URL:-http://localhost:8000/api}
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ./frontend:/usr/src/app
      # garante caching de node_modules dentro do container, sem sujar sua máquina
      - /usr/src/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_data:
  static_data:
  db_data:
